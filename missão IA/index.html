<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Você decide o futuro da IA</title>
</head>
<body>
  <div class="caixa-principal">
    <h1>Você decide o futuro da IA</h1>
    
    <div class="caixa-inicio">
      <p>
        Descubra como suas escolhas podem contribuir para o futuro do meio ambiente!
      </p>
      <button class="botao-iniciar">Iniciar</button>
    </div>

    <div class="caixa-perguntas oculto"></div>
    <div class="caixa-alternativas oculto"></div>

    <div class="caixa-resultado oculto">
      <h2>Resultado</h2>
      <p class="texto-resultado"></p>
      <button class="botao-reiniciar">Jogar novamente</button>
    </div>
  </div>

  <script type="module" src="js/script.js"></script>
</body>
</html>
